<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DJ CRM{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --accent: #7c3aed;
      --accent-light: #a78bfa;
    }
    body { background-color: #0f0f14; }
    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: #18181f;
      border-right: 1px solid #2a2a38;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar .brand {
      padding: 1.5rem 1.25rem 1rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-light);
      border-bottom: 1px solid #2a2a38;
    }
    .sidebar .nav-link {
      color: #9ca3af;
      padding: 0.6rem 1.25rem;
      border-radius: 0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      color: #e5e7eb;
      background: rgba(124, 58, 237, 0.15);
      border-left: 3px solid var(--accent);
    }
    .sidebar .nav-link i { font-size: 1rem; }
    .main-content {
      margin-left: 240px;
      padding: 2rem;
      min-height: 100vh;
    }
    .stat-card {
      background: #18181f;
      border: 1px solid #2a2a38;
      border-radius: 0.75rem;
    }
    .stat-card .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-light);
    }
    .card {
      background: #18181f;
      border: 1px solid #2a2a38;
    }
    .badge-pending   { background: #854d0e; color: #fef3c7; }
    .badge-accepted  { background: #14532d; color: #bbf7d0; }
    .badge-rejected  { background: #7f1d1d; color: #fecaca; }
    .badge-withdrawn { background: #1e3a5f; color: #bfdbfe; }
    .badge-no_response { background: #374151; color: #d1d5db; }
    .badge-demo      { background: #374151; color: #d1d5db; }
    .badge-in_progress { background: #713f12; color: #fef3c7; }
    .badge-finished  { background: #064e3b; color: #6ee7b7; }
    .badge-released  { background: #14532d; color: #bbf7d0; }
    .badge-shelved   { background: #1f2937; color: #9ca3af; }
    .table { --bs-table-bg: #18181f; --bs-table-border-color: #2a2a38; }
    .table-hover > tbody > tr:hover { --bs-table-hover-bg: rgba(124,58,237,0.08); }
    .btn-accent { background: var(--accent); color: #fff; border: none; }
    .btn-accent:hover { background: #6d28d9; color: #fff; }
    .page-header {
      border-bottom: 1px solid #2a2a38;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .form-control, .form-select {
      background: #111118;
      border-color: #2a2a38;
      color: #e5e7eb;
    }
    .form-control:focus, .form-select:focus {
      background: #111118;
      border-color: var(--accent);
      color: #e5e7eb;
      box-shadow: 0 0 0 0.2rem rgba(124,58,237,0.25);
    }
    .alert { border-radius: 0.5rem; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <i class="bi bi-disc-fill me-2"></i>DJ CRM
  </div>
  <nav class="nav flex-column mt-2">
    <a href="{% url 'crm:dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <div class="px-3 py-2 text-uppercase" style="font-size:0.65rem;color:#4b5563;letter-spacing:0.1em;">Catalog</div>
    <a href="{% url 'crm:label_list' %}" class="nav-link {% if 'label' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-building"></i> Labels
    </a>
    <a href="{% url 'crm:track_list' %}" class="nav-link {% if 'track' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-music-note-beamed"></i> Tracks
    </a>
    <div class="px-3 py-2 text-uppercase" style="font-size:0.65rem;color:#4b5563;letter-spacing:0.1em;">Workflow</div>
    <a href="{% url 'crm:submission_list' %}" class="nav-link {% if 'submission' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-send"></i> Submissions
    </a>
    <a href="{% url 'crm:submission_list' %}?status=pending" class="nav-link">
      <i class="bi bi-clock"></i> Pending
    </a>
    <a href="{% url 'crm:submission_list' %}?status=accepted" class="nav-link">
      <i class="bi bi-check-circle"></i> Accepted
    </a>
  </nav>
  <div class="mt-auto p-3" style="border-top:1px solid #2a2a38;">
    <a href="{% url 'crm:submission_create' %}" class="btn btn-accent btn-sm w-100">
      <i class="bi bi-plus-lg me-1"></i>Log Submission
    </a>
  </div>
</div>

<div class="main-content">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-3" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
