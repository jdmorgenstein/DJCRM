{% extends "base.html" %}
{% block title %}Delete {{ type }} — DJ CRM{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card p-4 text-center" style="border-color:#7f1d1d;">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
      <h4 class="mt-3">Delete {{ type }}?</h4>
      <p class="text-muted">
        Are you sure you want to delete <strong>{{ object }}</strong>?
        This action cannot be undone.
      </p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">Yes, delete</button>
        <a href="{{ cancel_url }}" class="btn btn-outline-secondary px-4">Cancel</a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
